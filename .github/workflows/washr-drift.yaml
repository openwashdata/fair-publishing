# washr API drift check (#12): installs washr and verifies that every
# washr function the guide's R chunks call is still exported, with the
# arguments the guide passes. Reports the CRAN version against WASHR_VERSION.
name: washr-drift

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # CRAN serves washr 1.1.0 until 1.2.0 is released there, so washr comes
      # from the dev branch on GitHub. Back to install.packages("washr")
      # once CRAN serves 1.2.0.
      - name: Install washr from GitHub
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: Rscript -e 'install.packages("pak"); pak::pak("openwashdata/washr@dev")'
      - name: Drift check
        run: Rscript scripts/washr_drift.R '*.qmd'
